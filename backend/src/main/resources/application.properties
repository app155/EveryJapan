spring.application.name=Globalin

# Server Configuration
server.port=8080

# DataSource Configuration
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# 1. localhost -> 127.0.0.1 \uB85C \uBCC0\uACBD (\uC5F0\uACB0 \uAC70\uBD80 \uD574\uACB0)
# 2. globalin -> globalin_db \uB85C \uBCC0\uACBD (DB \uC774\uB984 \uBD88\uC77C\uCE58 \uD574\uACB0)
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/globalin_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo

spring.datasource.username=root
# 3. \uBE44\uBC00\uBC88\uD638 \uC218\uC815 (XML \uD30C\uC77C \uAE30\uB85D \uAE30\uC900)
spring.datasource.password=rootpassword

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Logging
logging.level.root=INFO
logging.level.com.example.Globalin=DEBUG

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB